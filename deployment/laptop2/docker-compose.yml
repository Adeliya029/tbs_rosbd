version: '3.9'

services:

  minio:
    image: minio/minio:latest
    container_name: rosbd_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - rosbd_network
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.0
    container_name: rosbd_spark_master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../../spark/jobs:/opt/spark/jobs
      - ../../producer:/opt/spark/producer
    networks:
      - rosbd_network
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.0
    container_name: rosbd_spark_worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    ports:
      - "8081:8081"
    volumes:
      - ../../spark/jobs:/opt/spark/jobs
      - ../../producer:/opt/spark/producer
    networks:
      - rosbd_network
    restart: unless-stopped

networks:
  rosbd_network:
    driver: bridge

volumes:
  minio_data:
