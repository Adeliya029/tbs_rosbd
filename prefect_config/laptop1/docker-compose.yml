version: "3.9"

networks:
  rosbd_network:
    driver: bridge

services:

  # ──────────────────────────────
  #  ZOOKEEPER — Kafka coordinator
  # ──────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rosbd_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - rosbd_network
    restart: unless-stopped

  # ──────────────────────────────
  #  KAFKA — Broker dengan Tailscale listener
  #  PLAINTEXT      → internal Docker (kafka:29092)
  #  PLAINTEXT_HOST → localhost akses producer (localhost:9092)
  #  PLAINTEXT_TS   → Tailscale akses Laptop 2 (100.76.33.80:9093)
  # ──────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rosbd_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_TS:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_TS://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092,PLAINTEXT_TS://100.76.33.80:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - rosbd_network
    restart: unless-stopped

  # ──────────────────────────────
  #  PREFECT WORKER — scraping-pool
  #  Poll ke Prefect Server di Laptop 3 (Tailscale: 100.71.251.60)
  #  Eksekusi: historical_scraping_flow, health_check_flow
  # ──────────────────────────────
  prefect-worker-scraping:
    build:
      context: ./prefect
      dockerfile: Dockerfile
    container_name: seismic_prefect_worker_scraping
    restart: unless-stopped
    command: prefect worker start --pool scraping-pool --name worker-scraping-laptop1
    environment:
      PREFECT_API_URL: http://100.71.251.60:4200/api

      MINIO_ENDPOINT: http://100.122.2.11:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin12345}
      MINIO_SECURE: ${MINIO_SECURE:-False}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9093}
      KAFKA_TOPIC_EARTHQUAKE: ${KAFKA_TOPIC_EARTHQUAKE:-earthquake-events}
      KAFKA_TOPIC_LOGS: ${KAFKA_TOPIC_LOGS:-system-logs}

      BMKG_SCRAPE_URL: ${BMKG_SCRAPE_URL:-http://202.90.198.42/gempa/berita_gempa.php}
      SCRAPE_TIMEOUT: ${SCRAPE_TIMEOUT:-30}
      SCRAPE_DELAY: ${SCRAPE_DELAY:-0.5}

      POSTGRES_USER: ${POSTGRES_USER:-rosbd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosbd123}
      POSTGRES_DB: ${POSTGRES_DB:-seismic_db}

      LOG_DIR: /app/logs
    volumes:
      - ./prefect:/app
      - ./logs:/app/logs
    networks:
      - rosbd_network

  # ──────────────────────────────
  #  PREFECT DEPLOYMENT — register flow ke server
  #  Jalankan SEKALI setelah worker pertama kali naik
  #  Command: docker compose --profile deploy run prefect-deploy
  # ──────────────────────────────
  prefect-deploy:
    build:
      context: ./prefect
      dockerfile: Dockerfile
    container_name: seismic_prefect_deploy_scraping
    command: python deploy.py --pool scraping-pool
    environment:
      PREFECT_API_URL: http://100.71.251.60:4200/api

      MINIO_ENDPOINT: http://100.122.2.11:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin12345}
      MINIO_SECURE: ${MINIO_SECURE:-False}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9093}
      KAFKA_TOPIC_EARTHQUAKE: ${KAFKA_TOPIC_EARTHQUAKE:-earthquake-events}
      KAFKA_TOPIC_LOGS: ${KAFKA_TOPIC_LOGS:-system-logs}

      BMKG_SCRAPE_URL: ${BMKG_SCRAPE_URL:-http://202.90.198.42/gempa/berita_gempa.php}
      SCRAPE_TIMEOUT: ${SCRAPE_TIMEOUT:-30}
      SCRAPE_DELAY: ${SCRAPE_DELAY:-0.5}

      POSTGRES_USER: ${POSTGRES_USER:-rosbd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosbd123}
      POSTGRES_DB: ${POSTGRES_DB:-seismic_db}

      LOG_DIR: /app/logs
    volumes:
      - ./prefect:/app
    networks:
      - rosbd_network
    profiles:
      - deploy
    restart: "no"
